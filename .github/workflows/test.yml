name: Pinto bounded baseline diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - role: dependency
            target: 5bce64236564b992ad66574afeb3b0033f3d286b
          - role: base
            target: 663d115427e47444a316b588a6ba9014d82d2e95
    env:
      DIAGNOSTIC_ROLE: ${{ matrix.role }}
      DIAGNOSTIC_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: diagnostic-helper
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.target }}
          path: target
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: Run the fixed initial baseline with private runner-local output
        run: python3 diagnostic-helper/.github/pinto-diagnostic/run-diagnostic.py
      - name: Retain only the validated fixed summary for three days
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pinto-baseline-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pinto-diagnostic-${{ matrix.role }}/export/summary.json
          if-no-files-found: error
          retention-days: 3
