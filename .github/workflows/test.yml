name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * 6'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run still in progress.
# Scheduled and manual runs use a separate group so they never cancel
# or replace push or pull request runs, queued or running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '-weekly' || '' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.counts.outputs.tests }}
      skipped: ${{ steps.counts.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
      - run: npx playwright install --with-deps chromium
      - name: Check Playwright package version
        run: node -e "process.exit(require('playwright/package.json').version==='1.65.0'?0:1)"
      - uses: actions/setup-python@v6
      - run: pip install ruff==0.17.4
      - run: ruff check .
      - run: ruff format --check .
      - run: npm run typecheck
      - run: npm run lint
      - name: Allow unprivileged low-port binds for the default-port probe
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - name: Run the tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Count the tests
        id: counts
        if: always()
        shell: bash
        run: |
          count() { grep -E "^(#|ℹ) $1 [0-9]+" test-output.txt | tail -n 1 | grep -oE '[0-9]+$' || true; }
          echo "tests=$(count tests)" >> "$GITHUB_OUTPUT"
          echo "skipped=$(count skipped)" >> "$GITHUB_OUTPUT"

  # Final gate. Fails unless the test job succeeded, ran at least one test
  # and skipped none. Skipped is not a pass.
  suites-ran:
    name: Suites ran
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          TEST_RESULT: ${{ needs.test.result }}
          TEST_TESTS: ${{ needs.test.outputs.tests }}
          TEST_SKIPPED: ${{ needs.test.outputs.skipped }}
        run: |
          echo "test: result=$TEST_RESULT tests=${TEST_TESTS:-none} skipped=${TEST_SKIPPED:-none}"
          [ "$TEST_RESULT" = success ] || exit 1
          [ "${TEST_TESTS:-0}" -ge 1 ] || exit 1
          [ "${TEST_SKIPPED:-0}" -eq 0 ] || exit 1

  webkit:
    # A trial, not a required check. Runs on pushes, weekly and manual runs; skipped on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
      - run: npx playwright install --with-deps webkit
      - run: PINTO_BROWSER=webkit node --test --test-timeout=120000 test/home.test.ts test/element.test.ts

  # Mutation selection: on every pull request, classify each changed path.
  # A finitely enumerated set of files (the names in the case below) mutates
  # nothing when every changed path is in it and stays a regular
  # non-executable file; source, tests, fixtures, manifests, CI config and
  # workflow changes run every shard; a path the classifier cannot place runs
  # every shard too, and if the diff itself cannot be computed the plan job
  # fails instead of guessing. An addition or deletion runs every shard; a
  # detected rename is classified on both its old and new paths; a symlink,
  # executable bit or typechange runs every shard.
  # The docs files are in the zero set because src/, public/ and test/ cite
  # them only in comments (grep-verified 2026-11-12: the only src/public/test
  # reference to any zero-set file is a comment in test/contrast.test.ts).
  # Scheduled, push and manual runs always get the full matrix. The weekly
  # full sweep stays as the drift backstop, including for a missed consumer.
  plan:
    name: Mutation plan
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.classify.outputs.verdict }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      merge_base: ${{ steps.classify.outputs.merge_base }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # The base branch's full history, so the fork point exists.
          fetch-depth: 0
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request: full sweep."
            echo "verdict=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Resolve the moving base ref to a literal SHA, record the literal
          # fork point and head; only literal SHAs are ever diffed. These
          # SHAs certify the selection only; the runs check out the pull
          # request's merge state as before.
          git fetch --no-tags origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          base_sha=$(git rev-parse "origin/$GITHUB_BASE_REF")
          head_sha="${{ github.event.pull_request.head.sha }}"
          echo "base_sha=$base_sha" | tee -a "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" | tee -a "$GITHUB_OUTPUT"
          if ! git cat-file -e "$head_sha"; then
            git fetch --no-tags origin "$head_sha"
          fi
          if ! merge_base=$(git merge-base "$base_sha" "$head_sha"); then
            echo "The fork point cannot be resolved; failing closed."
            exit 1
          fi
          echo "merge_base=$merge_base" | tee -a "$GITHUB_OUTPUT"
          # Endpoint delta (the two-endpoint form of A...B): what this pull
          # request itself changes. --raw -z carries both revisions' modes
          # and both paths on a rename, NUL-safe. -M keeps rename detection
          # on; a detected rename classifies the old AND the new path.
          git diff --raw -z -M "$merge_base" "$head_sha" > "$RUNNER_TEMP/diff.raw"
          verdict=zero
          changed=0
          classify() {
            case "$1" in
              # The finitely enumerated zero-impact files; a new or unknown
              # path is never zero.
              .gitignore|LICENSE.md|README.md) return 0 ;;
              docs/contributing.md|docs/evidence-record.md|docs/requirements.md|docs/audit/phase5/evidence-record.txt) return 0 ;;
              *) verdict=full ;;
            esac
          }
          while IFS= read -r -d '' meta; do
            [ -n "$meta" ] || continue
            IFS= read -r -d '' path1
            changed=1
            srcmode=$(echo "$meta" | awk '{print substr($1, 2)}')  # strip the leading colon
            dstmode=$(echo "$meta" | awk '{print $2}')
            status=$(echo "$meta" | awk '{print $5}')
            # Strict rule: BOTH revisions of every changed file must be
            # regular non-executable files. An addition or deletion (the
            # absent side is 000000), a symlink, an executable bit or a
            # typechange is FULL - no new path ever lands in ZERO.
            [ "$srcmode" = "100644" ] || verdict=full
            [ "$dstmode" = "100644" ] || verdict=full
            case "$status" in
              R*|C*)
                IFS= read -r -d '' path2
                classify "$path1"
                classify "$path2"
                ;;
              *)
                classify "$path1"
                ;;
            esac
          done < "$RUNNER_TEMP/diff.raw"
          if [ "$changed" -eq 0 ]; then
            echo "The pull request changes no files: a legitimate, reported empty diff."
          fi
          echo "verdict=$verdict" | tee -a "$GITHUB_OUTPUT"
          if [ "$verdict" = zero ]; then
            echo "Zero mutation targets: every changed path is an enumerated non-executable file."
          else
            echo "Full sweep: every mutation target."
          fi


  # [PINTO] Mutation matrix, single-sourced from .github/mutation-ranges.json:
  # six whole-file shards plus line-range slices for the two dense targets
  # (public/room.js, src/index.ts). The guard job validates every ranged
  # target's slices before any mutation run.
  # Each slice runs ONLY the test files that exercise its target (the Tetris
  # per-file philosophy). Consequence, stated honestly: a mutant whose only
  # killing test lives in an unmapped file survives; the per-slice kill gate
  # (added with the live runs in qualification stage 2) proves each mapping
  # kills before merge.
  # QUALIFICATION STAGE 1 of 3: this push runs every slice's mapped tests
  # against unmutated code only. Live mutation runs, per-slice gates, report
  # uploads and the completeness job arrive in stage 2 once this baseline
  # qualifies; the temporary baseline step leaves in stage 3.
  mutation-plan:
    name: Mutation matrix
    needs: plan
    if: needs.plan.outputs.verdict == 'full'
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.read.outputs.include }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: read
        run: echo "include=$(jq -c '.include' .github/mutation-ranges.json)" >> "$GITHUB_OUTPUT"

  # The boundary check runs before any slice: a wrong range fails fast here
  # instead of silently skipping mutants in every slice that spans it.
  mutation-guard:
    name: Mutation range guard
    needs: plan
    if: needs.plan.outputs.verdict == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Check every ranged target's slices
        shell: bash
        run: |
          set -euo pipefail
          for target in room index; do
            file=$(jq -r --arg t "$target" '[.include[] | select(.target == $t)][0].mutate | split(":")[0]' .github/mutation-ranges.json)
            ranges=$(jq -r --arg t "$target" '[.include[] | select(.target == $t) | .mutate | split(":")[1]] | join(" ")' .github/mutation-ranges.json)
            node .github/scripts/check-mutation-ranges.mjs "$file" $ranges
          done

  mutation:
    name: mutation (${{ matrix.shard }})
    needs: [plan, mutation-plan, mutation-guard]
    if: needs.plan.outputs.verdict == 'full'
    runs-on: ubuntu-latest
    env:
      STRYKER_VERSION: '10.1.1'
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.mutation-plan.outputs.include) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      # [PINTO] Every slice installs dependencies: Pinto's tests import
      # express, socket.io and peers, unlike zero-dependency Salutant.
      - run: npm ci
      - run: sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
        if: matrix.browser == 'chromium'
      # The default-port probe tests (index slices) bind ports 80/443
      # directly; the same low-port allowance the main test job uses keeps
      # them on that direct path instead of the test's namespace fallback.
      - name: Allow unprivileged low-port binds for the default-port probe
        if: contains(matrix.tests, 'default-ports')
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - run: npx playwright install --with-deps chromium
        if: matrix.browser == 'chromium'
      - name: Check Playwright package version
        if: matrix.browser == 'chromium'
        run: node -e "process.exit(require('playwright/package.json').version==='1.65.0'?0:1)"
      # TEMP qualification instrumentation (removed in the final version):
      # run this slice's exact mapped test command on unmutated code, so a
      # later mutation run's kill data rests on a just-proven environment.
      - name: TEMP baseline - mapped tests on unmutated code
        run: node --test --test-timeout=120000 ${{ matrix.tests }}
