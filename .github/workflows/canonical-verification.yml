name: Manual Pinto baseline attribution capture
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pinto-baseline-attribution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/prep/pinto-baseline-attribution'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --init --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/prep/pinto-baseline-attribution
          path: evidence-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: a4d943626c62cb1ed86c96de7a9757f2ef5ffcdb
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - name: Verify frozen source and stage isolated evidence files
        env:
          EVIDENCE_HEAD: ${{ github.sha }}
          ENGINE: ${{ matrix.engine }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir receipts
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git -C evidence-source rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test "$(git -C app rev-parse HEAD)" = a4d943626c62cb1ed86c96de7a9757f2ef5ffcdb
          printf '%s  %s\n' 86edbe8f8ee7e7083af6ed545461cbe57318763b8e4cd596c2233e6cbded7c6b evidence-source/test/focused-evidence/attribution-inputs.json | sha256sum --check --strict
          python3 -I -B - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, subprocess
          source = Path('evidence-source/test/focused-evidence')
          manifest = json.loads((source / 'attribution-inputs.json').read_text())
          expected = {'helpers.ts', 'resource-receipt.ts', 'phase-evidence.mjs', 'baseline-attribution.test.ts', 'capture_once.py', 'export_logs.py'}
          if set(manifest) != expected: raise RuntimeError('manifest inventory mismatch')
          for name, digest in manifest.items():
              if hashlib.sha256((source / name).read_bytes()).hexdigest() != digest: raise RuntimeError('source hash mismatch: ' + name)
          for name in ['package.json', 'package-lock.json']:
              pinned = subprocess.check_output(['git', '-C', 'evidence-source', 'show', 'a4d943626c62cb1ed86c96de7a9757f2ef5ffcdb:' + name])
              if Path('app', name).read_bytes() != pinned: raise RuntimeError('dependency input mismatch')
          target_root = Path('app/test/focused-evidence')
          target_root.mkdir(exist_ok=False)
          for name in expected - {'capture_once.py', 'export_logs.py'}:
              target = target_root / name
              if target.exists(): raise RuntimeError('evidence overlay collision')
              shutil.copyfile(source / name, target)
          shutil.copyfile(source / 'attribution-inputs.json', 'receipts/input-inventory.json')
          PY
          printf 'app=%s\nevidence=%s\nengine=%s\n' a4d943626c62cb1ed86c96de7a9757f2ef5ffcdb "$EVIDENCE_HEAD" "$ENGINE" > receipts/identity.txt
          git -C app diff --binary > receipts/tracked-only.diff
          node --version > receipts/node.txt
          npm --version > receipts/npm.txt
          test "$(cat receipts/node.txt)" = v26.13.0
      - name: Install pinned dependencies once with a bound
        shell: bash
        run: |
          set -euo pipefail
          cd app
          timeout --signal=TERM --kill-after=5s 180s npm ci > ../receipts/install.log 2>&1
          node -e "process.exit(require('playwright/package.json').version==='1.65.0'?0:1)"
      - name: Capture each selected baseline case once, stop on any incomplete or unexpected result
        env:
          ENGINE: ${{ matrix.engine }}
        shell: bash
        run: |
          set -euo pipefail
          cd app
          printf '%s\n' 'NOT_QUALIFIED: selected raw captures still require manual oracle and resource review' > ../receipts/qualification.txt
          for case in 188-500 188-abort 168-pending 168-abort 168-invalid-json 168-500-text; do
            printf '%s\n' "$case" >> ../receipts/attempted-cases.txt
            python3 -I -B ../evidence-source/test/focused-evidence/capture_once.py "$case" "$ENGINE" "$(realpath ../receipts)/$case" > "../receipts/$case-supervisor.json"
          done
          sha256sum test/focused-evidence/helpers.ts test/focused-evidence/resource-receipt.ts test/focused-evidence/phase-evidence.mjs test/focused-evidence/baseline-attribution.test.ts > ../receipts/executed-inputs.sha256
          test "$(git rev-parse HEAD)" = a4d943626c62cb1ed86c96de7a9757f2ef5ffcdb
          python3 -I -B - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path('../receipts/input-inventory.json').read_text())
          for name in ('helpers.ts','resource-receipt.ts','phase-evidence.mjs','baseline-attribution.test.ts'):
              if hashlib.sha256(Path('test/focused-evidence',name).read_bytes()).hexdigest()!=manifest[name]: raise RuntimeError('executed fixture drift')
          PY
      - name: Export bounded raw receipts to standard job logs, no artifact or cache upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' 86edbe8f8ee7e7083af6ed545461cbe57318763b8e4cd596c2233e6cbded7c6b evidence-source/test/focused-evidence/attribution-inputs.json | sha256sum --check --strict
          python3 -I -B - <<'PY'
          import hashlib, json
          from pathlib import Path
          source=Path('evidence-source/test/focused-evidence')
          manifest=json.loads((source/'attribution-inputs.json').read_text())
          if hashlib.sha256((source/'export_logs.py').read_bytes()).hexdigest()!=manifest['export_logs.py']: raise RuntimeError('export source drift')
          PY
          python3 -I -B evidence-source/test/focused-evidence/export_logs.py
