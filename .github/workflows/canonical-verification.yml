name: Manual canonical verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --init --ipc=host
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        suite: [fast, slow]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7fbb6c26cd0d5cd053b2d6e50d9fd9fe47baac37
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci > /tmp/pinto-install.log 2>&1
      - name: Verify the existing browser version
        run: node -e "process.exit(require('playwright/package.json').version==='1.65.0'?0:1)"
      - name: Trust only this ephemeral checkout for Git
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GIT_CONFIG_COUNT:-0}" != 0 ]; then
            printf '%s\n' 'checkout-git-runtime-config=unexpected'
            exit 1
          fi
          workspace=$(pwd -P)
          if [ "$workspace" != "$(realpath "$GITHUB_WORKSPACE" 2>/tmp/pinto-workspace-verification.log)" ]; then
            printf '%s\n' 'checkout-workspace=unexpected'
            exit 1
          fi
          {
            printf '%s\n' 'GIT_CONFIG_COUNT=2' 'GIT_CONFIG_KEY_0=safe.directory' 'GIT_CONFIG_VALUE_0=' 'GIT_CONFIG_KEY_1=safe.directory'
            printf 'GIT_CONFIG_VALUE_1=%s\n' "$workspace"
          } >> "$GITHUB_ENV"
      - name: Report screened bootstrap status
        shell: bash
        run: |
          node --input-type=module 2>/tmp/pinto-bootstrap-diagnostic.log <<'DIAGNOSTIC' || printf '%s\n' 'bootstrap-diagnostic=unavailable'
          import { spawnSync } from 'node:child_process'
          import { statSync } from 'node:fs'
          const result = spawnSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' })
          console.log('bootstrap-git=' + (result.status === 0 ? 'ok' : result.error?.code === 'ENOENT' ? 'missing' : /dubious ownership|unsafe repository/.test(result.stderr || '') ? 'ownership-rejected' : 'failed-other'))
          console.log('bootstrap-checkout=' + (result.status === 0 ? result.stdout.trim() === '7fbb6c26cd0d5cd053b2d6e50d9fd9fe47baac37' ? 'expected' : 'unexpected' : 'unverified'))
          try { console.log('bootstrap-owner=' + (statSync('.').uid === process.getuid() ? 'same-user' : 'different-user')) } catch { console.log('bootstrap-owner=unavailable') }
          console.log('bootstrap-node=' + (/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(process.version) ? process.version : 'unrecognized'))
          DIAGNOSTIC
      - name: Verify the canonical suite
        env:
          SUITE: ${{ matrix.suite }}
        shell: bash
        run: |
          set -euo pipefail
          if ! actual_commit=$(git rev-parse HEAD 2>/tmp/pinto-checkout-verification.log); then
            printf '%s\n' 'checkout-pin=unverified'
            exit 1
          fi
          if [ "$actual_commit" != 7fbb6c26cd0d5cd053b2d6e50d9fd9fe47baac37 ]; then
            printf '%s\n' 'checkout-pin=unexpected'
            exit 1
          fi
          printf '%s\n' 'checkout-pin=expected'
          mkdir -p /tmp/pinto-measure
          set +e
          if [ "$SUITE" = slow ]; then
            node test/measurement/run.mjs --slow --out /tmp/pinto-measure > /tmp/pinto-measure.log 2>&1
          else
            node test/measurement/run.mjs --out /tmp/pinto-measure > /tmp/pinto-measure.log 2>&1
          fi
          suite_exit=$?
          set -e
          SUITE_EXIT="$suite_exit" node --input-type=module 2>/tmp/pinto-suite-diagnostic.log <<'DIAGNOSTIC' || printf '%s\n' 'suite-diagnostic=unavailable'
          import { readFileSync, existsSync } from 'node:fs'
          let log = ''
          try { log = readFileSync('/tmp/pinto-measure.log', 'utf8') } catch { console.log('suite-log=unavailable') }
          const categories = [
            ['git-ownership', /dubious ownership|unsafe repository/],
            ['git-missing', /spawnSync git ENOENT|spawn git ENOENT/],
            ['module-resolution', /ERR_MODULE_NOT_FOUND|MODULE_NOT_FOUND|ERR_PACKAGE_PATH_NOT_EXPORTED/],
            ['syntax', /SyntaxError:/],
            ['filesystem-permission', /EACCES|EPERM/],
            ['lock-integrity', /third-party package check failed:/],
            ['source-binding', /application source differs from the pinned production commit|source conflict for|source changed during measurement/],
            ['suite-timeout', /suite exceeded 20 minutes/],
            ['suite-nonzero', /(?:fast|slow) suite exited/],
            ['report-validation', /no server coverage reports|stale coverage report rejected|cut-off or unreadable coverage report|coverage report has no result array|served script differs|served script content could not be retrieved|verification server never started/]
          ]
          const matches = categories.filter(([, pattern]) => pattern.test(log)).map(([name]) => name)
          console.log('suite-exit=' + (/^[0-9]{1,3}$/.test(process.env.SUITE_EXIT || '') ? process.env.SUITE_EXIT : 'unavailable'))
          console.log('suite-start-marker=' + (/measuring (fast|slow) suite at 7fbb6c26cd0d5cd053b2d6e50d9fd9fe47baac37 into/.test(log) ? 'present' : 'absent'))
          console.log('suite-report-file=' + (existsSync('/tmp/pinto-measure/report.json') ? 'present-unvalidated' : 'absent'))
          console.log('suite-log-categories=' + (matches.length ? matches.join(',') : 'no-allowlisted-match'))
          DIAGNOSTIC
          if [ "$suite_exit" = 0 ]; then
            node --input-type=module 2>/dev/null <<'NUMBERS' || printf '%s\n' 'suite-numbers=unavailable'
          import { readFileSync } from 'node:fs'
          const allowed = ['src/index.ts', 'src/ice-servers.ts', 'public/element.js', 'public/home.js', 'public/ordinal.js', 'public/room.js']
          const count = (v) => Number.isSafeInteger(v) && v >= 0
          const pair = (p) => p && count(p.covered) && count(p.total) && p.covered <= p.total
          const report = JSON.parse(readFileSync('/tmp/pinto-measure/report.json', 'utf8'))
          const keys = Object.keys(report.files || {}).sort()
          const valid = report.repo === 'pinto' && report.suite === process.env.SUITE && report.commit === '7fbb6c26cd0d5cd053b2d6e50d9fd9fe47baac37' && keys.join() === [...allowed].sort().join() && keys.every((k) => pair(report.files[k].lines) && pair(report.files[k].branches) && pair(report.files[k].functions) && (report.files[k].functions.measurable === false ? report.files[k].functions.total === 0 : report.files[k].functions.measurable === undefined && report.files[k].functions.total > 0))
          if (!valid) {
            console.log('suite-numbers=invalid-report')
          } else {
            console.log('suite-numbers=ok suite=' + report.suite)
            for (const k of allowed) {
              const f = report.files[k]
              const fn = f.functions.measurable === false ? 'n/a' : f.functions.covered + '/' + f.functions.total
              console.log('suite-numbers-file=' + k + ' lines ' + f.lines.covered + '/' + f.lines.total + ' branches ' + f.branches.covered + '/' + f.branches.total + ' functions ' + fn)
            }
          }
          NUMBERS
          fi
          exit "$suite_exit"
