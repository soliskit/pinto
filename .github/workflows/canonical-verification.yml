name: Manual canonical verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        suite: [fast, slow]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8795333b5d22290d1c2601c6ef5283c9f5fcd7fd
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci > /tmp/pinto-install.log 2>&1
      - name: Verify the existing browser version
        run: node -e "process.exit(require('playwright/package.json').version==='1.64.1'?0:1)"
      - name: Verify the canonical suite
        env:
          SUITE: ${{ matrix.suite }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pinto-measure
          if [ "$SUITE" = slow ]; then
            node test/measurement/run.mjs --slow --out /tmp/pinto-measure > /tmp/pinto-measure.log 2>&1
          else
            node test/measurement/run.mjs --out /tmp/pinto-measure > /tmp/pinto-measure.log 2>&1
          fi
